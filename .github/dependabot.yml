version: 2
updates:
  # Patch and minor updates only: those are safe to merge unattended once CI
  # passes. Major versions are never proposed automatically.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: saturday
      time: "03:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: "/functions"
    schedule:
      interval: weekly
      day: saturday
      time: "03:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: saturday
      time: "03:00"
      timezone: Asia/Kolkata
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
